{{- if .Values.service.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp
  labels:
    app.kubernetes.io/name: openscad
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.mcp.port }}
      targetPort: mcp
      protocol: TCP
      name: mcp
  selector:
    app.kubernetes.io/name: openscad
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gui
{{- end }}
