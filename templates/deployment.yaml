apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gui
  labels:
    app.kubernetes.io/name: openscad
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gui
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: openscad
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openscad
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gui
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: gui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: projects
              mountPath: /home/{{ .Values.env.NB_USER | default "openscad" }}/projects
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      volumes:
        - name: projects
          {{- if $.Values.pvc.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-projects
          {{- else }}
          emptyDir: {}
          {{- end }}
