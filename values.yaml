replicaCount: 1

image:
  repository: openscad/openscad
  tag: trixie-selkies
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# JupyterLab-style env for the OpenSCAD container (seeded from values; no literals)
env:
  NB_USER: openscad
  NB_UID: "1000"
  NB_GID: "1000"
  CHOWN_HOME: "true"

service:
  type: ClusterIP
  port: 3000
  # MCP port — values-gated, disabled by default. Never appears on the Ingress.
  mcp:
    enabled: false
    port: 8765

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: openscad.apps2.k3s2.tr5k.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: openscad-tls
      hosts:
        - openscad.apps2.k3s2.tr5k.net

pvc:
  enabled: true
  storageClassName: rook-cephfs
  accessMode: ReadWriteMany
  size: 10Gi

resources:
  limits:
    cpu: "2"
    memory: "4Gi"
  requests:
    cpu: "500m"
    memory: "1Gi"

nodeSelector: {}
tolerations: []
affinity: {}

mcp:
  image:
    repository: ""
    tag: ""
  command: []
